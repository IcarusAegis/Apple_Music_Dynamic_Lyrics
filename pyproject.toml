[project]
name = "apple-music-lyric"
version = "0.1.0"
description = "桌面歌词悬浮窗 — 为 Windows Apple Music 自动获取并展示同步歌词"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pycryptodome>=3.23.0",
    "pyside6>=6.10.2",
    "winrt-windows-foundation>=3.2.1",
    "winrt-windows-media-control>=3.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apple_music_lyric"]
